      <div style="max-width: 800px; margin: 40px auto; padding: 24px; font-family: sans-serif; line-height: 1.6; color: #1e293b;">
        <h1>SheSync — Women's Holistic Wellness &amp; Cycle Companion</h1>
        <p><strong>Tagline:</strong> Your cycle. Your care. Your space.</p>
        <p>
          SheSync is a privacy-first progressive web application designed for women's holistic health. All health data is processed and stored 100% locally on your device with zero cloud tracking.
        </p>
        <h2>Core Integrated Modules:</h2>
        <ul>
          <li><strong>Periods &amp; Wellbeing:</strong> Deterministic menstrual cycle forecasting, ovulation calculations, daily symptom logging, and printable clinical summaries.</li>
          <li><strong>Wellness Store (Simulation Mode):</strong> Curated menstrual, maternal, and wellness care products with simulated cart checkout and itemized delivery receipts.</li>
          <li><strong>Doctor Appointments (Simulation Mode):</strong> Multi-specialty practitioner directory, conflict-free appointment booking, and RFC 5545 <code>.ics</code> calendar synchronization.</li>
          <li><strong>Learn &amp; Support Hub:</strong> Evidence-based reproductive health guides citing WHO, MoHFW India, NHS, and CDC, interactive Myth vs. Fact quiz, and 24/7 helplines.</li>
          <li><strong>Pregnancy Emergency Care &amp; SOS:</strong> 1-Click SOS broadcasting, consent-filtered medical profile sharing, 24/7 maternity referral hospital triage, and real Web Bluetooth Low Energy (BLE) heart-rate monitoring (GATT 0x180D / 0x2A37).</li>
        </ul>
        <p><em>Note: JavaScript must be enabled in your browser to interact with SheSync's real-time features.</em></p>
      </div>
    </noscript>
