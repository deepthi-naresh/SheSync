<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A154B"/>
      <stop offset="50%" stop-color="#3B113C"/>
      <stop offset="100%" stop-color="#230A24"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#FDA4AF"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Decorative Ambient Circles -->
  <circle cx="1050" cy="120" r="280" fill="#F472B6" fill-opacity="0.18" filter="url(#glow)"/>
  <circle cx="150" cy="520" r="240" fill="#C084FC" fill-opacity="0.15" filter="url(#glow)"/>

  <!-- Main Card Container -->
  <rect x="80" y="70" width="1040" height="490" rx="28" fill="url(#cardGrad)" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5"/>

  <!-- Logo Icon -->
  <g transform="translate(130, 120)">
    <rect width="84" height="84" rx="22" fill="#F472B6" fill-opacity="0.25"/>
    <rect x="2" y="2" width="80" height="80" rx="20" fill="#4A154B" stroke="#F472B6" stroke-opacity="0.5" stroke-width="1.5"/>
    <!-- Heart Handshake Silhouette -->
    <path d="M42 22C42 22 28 35 28 46C28 53.7 34.3 60 42 60C49.7 60 56 53.7 56 46C56 35 42 22 42 22Z" fill="url(#roseGrad)"/>
    <circle cx="34" cy="46" r="6" fill="#C084FC" fill-opacity="0.8"/>
    <circle cx="50" cy="46" r="6" fill="#C084FC" fill-opacity="0.8"/>
  </g>

  <!-- Title & Tagline -->
  <text x="238" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">SheSync</text>
  <text x="240" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="500" fill="#FDA4AF">Your cycle. Your care. Your space.</text>

  <!-- Value Proposition Headline -->
  <text x="130" y="285" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">
    Women's Holistic Wellness Companion
  </text>
  <text x="130" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#E2E8F0">
    100% Private Client-Side Architecture • Deterministic Cycle Math • Real Web Bluetooth Heart-Rate Care
  </text>

  <!-- Feature Pills -->
  <g transform="translate(130, 375)">
    <!-- Pill 1: Cycle Tracking -->
    <rect x="0" y="0" width="190" height="52" rx="26" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-opacity="0.25"/>
    <text x="24" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">🩸 Cycle Tracking</text>

    <!-- Pill 2: Wellness Store -->
    <rect x="206" y="0" width="180" height="52" rx="26" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-opacity="0.25"/>
    <text x="230" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">🛍️ Care Essentials</text>

    <!-- Pill 3: Doctor Consultations -->
    <rect x="402" y="0" width="190" height="52" rx="26" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-opacity="0.25"/>
    <text x="426" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">🩺 Doctor Booking</text>

    <!-- Pill 4: Evidence-Based Learn -->
    <rect x="608" y="0" width="160" height="52" rx="26" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-opacity="0.25"/>
    <text x="630" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">📚 Health Guides</text>

    <!-- Pill 5: Emergency SOS & BLE -->
    <rect x="784" y="0" width="170" height="52" rx="26" fill="#F43F5E" fill-opacity="0.28" stroke="#F43F5E" stroke-opacity="0.6"/>
    <text x="806" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#FECDD3">🚨 SOS &amp; BLE Pulse</text>
  </g>

  <!-- Bottom Privacy Footer Badge -->
  <g transform="translate(130, 480)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" fill="#A7F3D0">
      🔒 Zero Cloud Telemetry • No Third-Party Trackers • Private Local Storage • SITAMS × HackSphere
    </text>
  </g>
</svg>
